  function adv(c){ return (c>='0' && c<='9') ? 1 : 1.5; }
  function strWidth(str,cw){
    var w = 0, last = '';
    for(var i=0;i<str.length;i++){
      var c = str.charAt(i);
      if(c===' '){ w += 2.4*cw; last=' '; continue; }
      var g = FONT[c];
      w += ((g ? g[0].length/4 : 3) + adv(c)) * cw; last = c;

    var p = new Path2D(), x = x0, qw = cw/4, qh = ch/4;

      var c = str.charAt(i);
      if(c===' '){ x += 2.4*cw; continue; }
      var g = FONT[c];
      if(!g){ x += 4*cw; continue; }
      for(var r=0;r<g.length;r++){
        var row = g[r], k = 0;
        while(k<row.length){

    if(muted) return;

      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    }catch(e){}
  }

        var zx = [p.x+3, p.x+S/2, p.x+S-3];
        for(var zi=0; zi<3; zi++){
          var zd = zigDepth(zx[zi]);
          if(p.y + 2 < zd || p.y + S - 2 > H - zd){ die(); return; }
        }

        var sides = ['left','right'];
        for(var a=0;a<2;a++){
          var arr2 = spikes[sides[a]];
          for(var b=0;b<arr2.length;b++){
            if(hitsSpike(sides[a], arr2[b])){ die(); return; }
          }
        }

        if(Math.hypot(star.x-(p.x+S/2), star.y-(p.y+S/2)) < S/2 + 11){
          stars++; store('bb_stars',stars);
          sfx('star');
          star.on = false;
        }
      } else {
        // ---------- GO! Mode Update ----------
        if(!p.launched){ p.vx = 0; if(goStartY - p.y > 110){ p.launched = true; p.dir = 1; p.vx = SPD(); } }
        goObstaclesUpdate();
        if(p.x + S >= W){
          p.x = W - S; p.dir = -1; p.vx = -SPD();
          sfx('wall');
          wallHit();
        } else if(p.x <= 0){
          p.x = 0; p.dir = 1; p.vx = SPD();
          sfx('wall');
          wallHit();
        }

        // Camera follows upward climb smoothly (never scrolls back down)
        var targetCam = p.y - H*0.48;
        if(targetCam < camY) camY = targetCam;

        // Height score & section tracking
        var climbed = Math.max(0, Math.floor((goStartY - p.y) / 42));
        if(climbed > score) score = climbed;

        var newSec = Math.max(0, Math.floor((H - (p.y + S/2)) / 680));
        if(newSec > goPassedSection){
          goPassedSection = newSec;
          sfx('chime');
        }

        // Stream new sections above camera
        while(goNextSectionY > camY - H){
          buildGoSection(goSectionIdx);
        }

        // Ribbon trail
        goTrail.push({x: p.x + S/2, y: p.y + S/2});
        if(goTrail.length > 110) goTrail.shift();

        // Coin pickups
        for(var ci=0;ci<goCoins.length;ci++){
          var c = goCoins[ci];
          if(!c.taken && Math.hypot(c.x - (p.x+S/2), c.y - (p.y+S/2)) < S/2 + 13){
            c.taken = true;
            stars++; store('bb_stars',stars);
            sfx('star');
          }
        }

        if(checkGoCollisions()){ die(); return; }
      }
    } else if(state==='dead'){
      deadT += dt;
      deadPhys(dt);
      if(deadT > MENU_AT && !retracted){
        retracted = true;
        retract('left'); retract('right');
      }
    }
  }

    ctx.fillStyle='#4a4a4a'; ctx.fillRect(cx-44,cy-40,88,88);
    drawCube(cx-44,cy-44,88,0,1,null,1,viewIdx);
    if(!ownedHas(viewIdx)){
      ctx.fillStyle='rgba(60,50,10,0.55)'; ctx.fillRect(cx-44,cy-44,88,88); iconLock(cx,cy,34);
      if(sv.fan){ drawStr('FOLLOW US',W/2,H*0.635,3.3,3.3,'#ffffff',dark,3); drawStr('TO UNLOCK',W/2,H*0.685,3.3,3.3,'#ffffff',dark,3); }
      else { drawCoinIcon(W/2-26,H*0.65,9); drawStrL(String(sv.cost),W/2-10,H*0.65,4,'#ffffff'); drawStr('TAP TO BUY',W/2,H*0.69,2.6,2.6,'#ffffff',dark,2); }
    } else drawStr(viewIdx===eq ? 'USING' : 'TAP TO USE',W/2,H*0.65,3.3,3.3,'#ffffff',dark,3);
    pillR(W-62,26,104,28,'#ffffff'); drawCoinIcon(W-100,26,9); drawStrL(String(stars),W-86,26,3.2,INK);
    [B.prev,B.next].forEach(function(b,i){
      var off = i ? viewIdx>=SK.length-1 : viewIdx<=0, d = i ? 1 : -1;
      ctx.fillStyle = off ? '#7d7d7d' : INK; circle(b.x,b.y,b.r);
      ctx.fillStyle = off ? '#a5a5a5' : '#ffffff';
      ctx.beginPath(); ctx.moveTo(b.x-d*5,b.y-10); ctx.lineTo(b.x+d*8,b.y); ctx.lineTo(b.x-d*5,b.y+10); ctx.closePath(); ctx.fill();
    });
    var bw=100, bh=32, bx=B.back.x-bw/2, by=B.back.y-bh/2;
    ctx.fillStyle=dark; roundRectPath(bx,by+4,bw,bh,bh/2); ctx.fill();
    ctx.fillStyle=INK; roundRectPath(bx,by,bw,bh,bh/2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(bx+24,B.back.y); ctx.lineTo(bx+32,B.back.y-6); ctx.lineTo(bx+32,B.back.y+6); ctx.closePath(); ctx.fill();
    drawStr('BACK',B.back.x+12,B.back.y,3,3,'#ffffff',null);
  }
  function iconInfo(cx,cy,r){
    ctx.fillStyle='#fff'; ctx.fillRect(cx-r*0.09,cy-r*0.08,r*0.18,r*0.5); ctx.fillRect(cx-r*0.09,cy-r*0.36,r*0.18,r*0.16);
    ctx.fillRect(cx-r*0.2,cy+r*0.36,r*0.4,r*0.1); ctx.fillRect(cx-r*0.2,cy-r*0.08,r*0.2,r*0.1);
  }
  function iconA(cx,cy,r){
    ctx.fillStyle='#fff'; ctx.font='bold '+(r*1.1)+'px '+GFONT; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText('A',cx,cy+r*0.4); ctx.textAlign='left';
  }
  var logoImg = new Image(); logoImg.src = 'https://i.ibb.co/krpP9zq/algebralogo.png';
  function drawCredits(){
    var dark = rgb(bgC,0.72), cy = H*0.5, lh = 30;
    drawStr('CREDITS',W/2,H*0.11,6,6,'#ffffff',dark,4);
    var y = cy - 118;
    function line(str,sz,col){ gtext(str,W/2,y,sz,col||'#ffffff'); y += lh; }
    line('A WEB REMAKE OF',24); line('BOUNCY BIT AND BOUNCY BIT GO',21); y += 20;
    line('ORIGINAL GAMES BY',24); gtext('DEADLY SERIOUS MEDIA',W/2,y,30,'#ffff00'); y += lh+20;
    line('REMAKE MADE BY',24); gtext('HAZZA',W/2,y,30,'#ffff00'); y += lh+26;
    // "an [logo] original"
    var lw = 0, lhh = 34;
    if(logoImg.complete && logoImg.naturalWidth){ lhh = 34; lw = logoImg.naturalWidth/logoImg.naturalHeight*lhh; if(lw > 190){ lw = 190; lhh = lw*logoImg.naturalHeight/logoImg.naturalWidth; } }
    else lw = 150;
    ctx.font = 'bold 24px '+GFONT;
    var wa = 32, wb = 70, tot = wa + 8 + lw + 8 + wb, x0 = W/2 - tot/2;
    gtext('AN',x0,y,24,'#ffffff',null,0,'left');
    if(logoImg.complete && logoImg.naturalWidth) ctx.drawImage(logoImg, x0+wa+8, y-lhh/2, lw, lhh);
    else gtext('ALGEBRA PRACTISE',x0+wa+8+lw/2,y,22,'#ffff00');
    gtext('ORIGINAL',x0+wa+8+lw+8,y,24,'#ffffff',null,0,'left');
    var B=btns(), bw=100, bh=32, bx=B.back.x-bw/2, by=H*0.88-bh/2;
    ctx.fillStyle=dark; roundRectPath(bx,by+4,bw,bh,bh/2); ctx.fill();
    ctx.fillStyle=INK; roundRectPath(bx,by,bw,bh,bh/2); ctx.fill();
    drawStr('BACK',B.back.x,by+bh/2,3,3,'#ffffff',null);
  }
  function iconRestart(cx,cy,r){
    var R = r*0.44, s = -Math.PI/2 + 0.55, e = s + 5.2;
    ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
    ctx.lineWidth = r*0.2; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.arc(cx,cy,R,s,e,false); ctx.stroke();
    var px = cx + Math.cos(e)*R, py = cy + Math.sin(e)*R;
    var tx = -Math.sin(e), ty = Math.cos(e), nx = Math.cos(e), ny = Math.sin(e);
    var L = r*0.34, Wd = r*0.3;
    ctx.beginPath();
    ctx.moveTo(px + tx*L, py + ty*L);
    ctx.lineTo(px + nx*Wd, py + ny*Wd);
    ctx.lineTo(px - nx*Wd, py - ny*Wd);
    ctx.closePath(); ctx.fill();
  }
  function iconSound(cx,cy,r,on){
    var s = r*0.45;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = r*0.1; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx-s,cy-s*0.45); ctx.lineTo(cx-s*0.45,cy-s*0.45); ctx.lineTo(cx+s*0.1,cy-s*0.95);
    ctx.lineTo(cx+s*0.1,cy+s*0.95); ctx.lineTo(cx-s*0.45,cy+s*0.45); ctx.lineTo(cx-s,cy+s*0.45);
    ctx.closePath(); ctx.fill();
    if(on){
      ctx.beginPath(); ctx.arc(cx+s*0.1,cy,s*0.6,-0.9,0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx+s*0.1,cy,s*1.1,-0.9,0.9); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(cx+s*0.5,cy-s*0.5); ctx.lineTo(cx+s*1.3,cy+s*0.5);
      ctx.moveTo(cx+s*1.3,cy-s*0.5); ctx.lineTo(cx+s*0.5,cy+s*0.5);
      ctx.stroke();
    }
  }
  function roundRectPath(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arc(x+w-r,y+r,r,-Math.PI/2,0);
    ctx.lineTo(x+w,y+h-r); ctx.arc(x+w-r,y+h-r,r,0,Math.PI/2);
    ctx.lineTo(x+r,y+h); ctx.arc(x+r,y+h-r,r,Math.PI/2,Math.PI);
    ctx.lineTo(x,y+r); ctx.arc(x+r,y+r,r,Math.PI,Math.PI*1.5);
    ctx.closePath();
  }

  function drawMenu(pop,modeName){
    if(mode==='go'){ if(modeName==='ready') drawGoMenu(); else drawGoDead(pop); return; }
    var dark = rgb(bgC,0.72), B = btns();
    var titleText = (mode === 'go') ? 'BOUNCY BIT GO!' : 'BOUNCY BIT';
    var titleCw = (mode === 'go') ? 5.6 : 7.11;
    var activeBest = (mode === 'go') ? goBest : best;

    ctx.save();
    ctx.translate(W/2,H*0.30); ctx.scale(pop,pop); ctx.translate(-W/2,-H*0.30);

    drawStr(titleText, W/2, 65.8, titleCw, titleCw, '#ffffff', dark, 3);
    drawStr('HIGHSCORE', W/2, 112.3, 4.44, 4.44, INK, dark, 2);
    drawStr(String(activeBest), W/2, 157.2, 8.44, 8.44, '#ffff00', dark, 3);

    if(modeName==='dead'){
      var cw = bigCw(lastScore);
      drawStr(String(lastScore), W/2, H*0.4874, cw, cw, INK, dark, 3);
      ctx.fillStyle = dark; circle(B.restart.x, B.restart.y+5, B.restart.r);
      ctx.fillStyle = INK;  circle(B.restart.x, B.restart.y,   B.restart.r);
      iconRestart(B.restart.x, B.restart.y, B.restart.r);
    } else {
      var pw = 220, ph = 44, py = H*0.64 - ph/2, pulse = 1 + 0.04*Math.sin(t*5);
      ctx.save();
      ctx.translate(W/2, py+ph/2); ctx.scale(pulse,pulse); ctx.translate(-W/2, -(py+ph/2));
      ctx.fillStyle = dark; roundRectPath(W/2-pw/2, py+4, pw, ph, ph/2); ctx.fill();
      ctx.fillStyle = INK;  roundRectPath(W/2-pw/2, py,   pw, ph, ph/2); ctx.fill();
      drawStr('TAP TO START', W/2, py+ph/2, 3, 3, '#ffffff', null);
      ctx.restore();

      // Mode switcher pill button
      var mb = B.modeBtn, mx = mb.x - mb.w/2, my = mb.y - mb.h/2;
      ctx.fillStyle = dark; roundRectPath(mx, my+3, mb.w, mb.h, mb.h/2); ctx.fill();
      ctx.fillStyle = '#ffffff'; roundRectPath(mx, my, mb.w, mb.h, mb.h/2); ctx.fill();
      var label = 'BOUNCY BIT GO!';
      drawStr(label, mb.x, mb.y, 2.5, 2.5, INK, null);
    }

    var set = (modeName==='dead') ? [B.sound,B.skin] : [B.rt,B.rf,B.rs,B.rk];
    set.forEach(function(b){ ctx.fillStyle=dark; circle(b.x,b.y+4,b.r); ctx.fillStyle=INK; circle(b.x,b.y,b.r); });
    if(modeName==='dead'){ iconSound(B.sound.x,B.sound.y,B.sound.r,!muted); iconHome(B.skin.x,B.skin.y,B.skin.r); }
    else { iconInfo(B.rt.x,B.rt.y,B.rt.r); iconA(B.rf.x,B.rf.y,B.rf.r); iconSound(B.rs.x,B.rs.y,B.rs.r,!muted); drawStar(B.rk.x,B.rk.y,B.rk.r*0.62,'#ffff00'); }
    ctx.restore();
  }

  // ---------- draw GO! world ----------
  function drawGoWorld(menuShown){
    ctx.save();
    ctx.translate(0, -camY);
    for(var si=goSections.length-1; si>=0; si--){
      var sec = goSections[si];
      if(sec.y1 < camY - 40 || sec.y0 > camY + H + 40) continue;
      ctx.fillStyle = sec.color;
      ctx.beginPath();
      ctx.moveTo(0, sec.y1 + 24); ctx.lineTo(W, sec.y1 + 24); ctx.lineTo(W, sec.y0);
      for(var i=8;i>=0;i--) ctx.lineTo(i*(W/8), sec.y0 + (i%2===0 ? -9 : 9));
      ctx.closePath(); ctx.fill();
      if(sec.dots){                                   // grey section: faint pattern of little bits
        ctx.fillStyle = 'rgba(0,0,0,0.075)';
        var gy0 = Math.max(sec.y0 + 20, camY - 30), gy1 = Math.min(sec.y1 - 6, camY + H + 30);
        for(var gy = Math.ceil(gy0/54)*54; gy < gy1; gy += 54){
          var off = (Math.round(gy/54) % 2) ? 27 : 0;
          for(var gx = 14 + off; gx < W; gx += 54) roundRectPath(gx-8, gy-8, 16, 16, 3), ctx.fill();
        }
      }
    }
    ctx.fillStyle = '#ffffff';
    goWallSpikes.forEach(function(ws){
      if(ws.y < camY - 40 || ws.y > camY + H + 40) return;
      var base = ws.side==='right' ? W : 0, dx = ws.side==='right' ? -1 : 1;
      ctx.beginPath(); ctx.moveTo(base, ws.y - GSH/2); ctx.lineTo(base, ws.y + GSH/2); ctx.lineTo(base + dx*GD, ws.y); ctx.closePath(); ctx.fill();
    });
    goObstacles.forEach(function(o){
      if(o.y < camY - o.reach - 70 || o.y > camY + H + o.reach + 70) return;
      switch(o.kind){
        case 'rail':
          ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(0, o.y-1, W, 2);
          [0,1].forEach(function(i){ var rx = railX(o,i); if(rx!==null) drawSawWheel(rx, o.y, o.r); });
          break;
        case 'orbit': {
          ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(o.cx, o.y, o.R, 0, Math.PI*2); ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,0.6)'; circle(o.cx, o.y, 2.5);
          var a = t*o.speed + o.phase;
          drawSawWheel(o.cx + Math.cos(a)*o.R, o.y + Math.sin(a)*o.R, o.r);
          break; }
        case 'hbar': {
          var ag = armGeo(o), Ls = ag.L, hh2 = ag.hh, tip = ag.tip;
          ctx.save(); ctx.translate(o.side==='left' ? 0 : W, o.y); if(o.side==='right') ctx.scale(-1,1);
          ctx.beginPath(); ctx.rect(0,-100,o.w+40,200); ctx.clip();            // the arrow lives inside the wall
          shadowed(function(){ ctx.beginPath(); ctx.moveTo(Ls-o.w,-hh2); ctx.lineTo(Ls-tip,-hh2); ctx.lineTo(Ls,0); ctx.lineTo(Ls-tip,hh2); ctx.lineTo(Ls-o.w,hh2); ctx.closePath(); });
          ctx.restore();
          break; }
        case 'pivot':
          ctx.save(); ctx.translate(o.px, o.y); ctx.rotate(o.a0 + t*o.speed);
          shadowed(function(){ arrowPoly(-o.len,o.len,o.h/2,o.h*0.75,true,true); });
          ctx.restore(); drawHub(o.px, o.y, 17);
          break;
        case 'spinner':
          ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.a0 + t*o.speed);
          shadowed(function(){ arrowPoly(-o.L,o.L,o.h/2,o.h*0.75,true,true); });
          ctx.restore(); drawHub(o.x, o.y, 17);
          break;
        case 'hex': {
          var hp = o.poly || (o.poly = hexPoly(o));
          shadowed(function(){ ctx.beginPath(); hp.forEach(function(q,i){ if(i) ctx.lineTo(q[0],q[1]); else ctx.moveTo(q[0],q[1]); }); ctx.closePath(); });
          break; }
        case 'dia':
          shadowed(function(){ ctx.beginPath(); ctx.moveTo(o.x,o.y-o.s); ctx.lineTo(o.x+o.s,o.y); ctx.lineTo(o.x,o.y+o.s); ctx.lineTo(o.x-o.s,o.y); ctx.closePath(); });
          break;
        case 'block': {
          var hh = o.h/2, nS = Math.max(1,Math.round(o.w/44)), P = o.w/nS;
          ctx.save(); ctx.translate(o.side==='left' ? 0 : W, o.y); if(o.side==='right') ctx.scale(-1,1);
          ctx.fillStyle = '#1d1d1d'; ctx.fillRect(-2,-hh,o.w+2,o.h);
          ctx.fillStyle = '#ffffff'; ctx.beginPath();
          for(var n=0;n<nS;n++){
            if(o.spT){ ctx.moveTo(n*P,-hh); ctx.lineTo((n+1)*P,-hh); ctx.lineTo((n+0.5)*P,-hh-o.dp); ctx.closePath(); }
            if(o.spB){ ctx.moveTo(n*P, hh); ctx.lineTo((n+1)*P, hh); ctx.lineTo((n+0.5)*P, hh+o.dp); ctx.closePath(); }
          }
          if(o.endSp){ ctx.moveTo(o.w,-hh*0.6); ctx.lineTo(o.w+GD,0); ctx.lineTo(o.w,hh*0.6); ctx.closePath(); }
          ctx.fill(); ctx.restore();
          break; }
      }
    });
    goCoins.forEach(function(c){ if(!c.taken && c.y >= camY - 30 && c.y <= camY + H + 30) drawCoinIcon(c.x, c.y, 14); });
    if(goTrail.length > 2 && state==='play'){          // soft tapered ribbon, thick at the bit, fading to a thin tail
      var n = goTrail.length, L = [], R = [], i2, pass, T = goTrail.map(function(q){ return {x:q.x, y:q.y}; });
      for(pass=0;pass<4;pass++) for(i2=1;i2<n-1;i2++){ T[i2] = {x:(T[i2-1].x+T[i2].x*2+T[i2+1].x)/4, y:(T[i2-1].y+T[i2].y*2+T[i2+1].y)/4}; }   // smooth the path
      for(i2=0;i2<n;i2++){
        var a0 = T[Math.max(0,i2-2)], a1 = T[Math.min(n-1,i2+2)], dx = a1.x-a0.x, dy = a1.y-a0.y, dl = Math.hypot(dx,dy) || 1;
        var fk = i2/(n-1), w = 2 + 11.5*Math.pow(fk,0.8), nx = -dy/dl*w, ny = dx/dl*w;
        L.push([T[i2].x+nx, T[i2].y+ny]); R.push([T[i2].x-nx, T[i2].y-ny]);
      }
      var g = ctx.createLinearGradient(goTrail[0].x, goTrail[0].y, goTrail[n-1].x, goTrail[n-1].y);
      g.addColorStop(0,'rgba(255,255,255,0.10)'); g.addColorStop(0.6,'rgba(255,255,255,0.45)'); g.addColorStop(1,'rgba(255,255,255,0.78)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(L[0][0],L[0][1]);
      for(i2=1;i2<n;i2++) ctx.lineTo(L[i2][0],L[i2][1]);
      for(i2=n-1;i2>=0;i2--) ctx.lineTo(R[i2][0],R[i2][1]);
      ctx.closePath(); ctx.fill();
    }
    if(state==='play') drawCube(p.x, p.y, S, skin, p.dir, 'rgba(0,0,0,0.22)', sqx());
    else if(state==='dead') drawDeadBit(p.x, p.y, S);
    ctx.restore();
  }

  // ---------- main draw ----------
  function draw(){
    var dark = rgb(bgC,0.72);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#0e0e0e';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    var k = dpr*scale;
    var sx = shake ? (Math.random()-0.5)*shake : 0;
    var sy = shake ? (Math.random()-0.5)*shake : 0;
    ctx.setTransform(k,0,0,k, ox*dpr + sx*k, oy*dpr + sy*k);

    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();

    ctx.fillStyle = rgb(bgC);
    ctx.fillRect(0,0,W,H);

    var menuT = (state==='dead') ? clamp((deadT-MENU_AT)/MENU_LEN,0,1) : (state==='ready' ? 1 : 0);
    var menuShown = menuT > 0;

    if(mode === 'go' && (state === 'play' || state === 'dead')){
      drawGoWorld(menuShown);
      if(state==='dead' && menuShown){ ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillRect(0,0,W,H); } else if(state==='play') goHUD();
    } else {
      // Classic gameplay + shared menus
      if(state==='play' || (state==='dead' && !menuShown)){
        var cw = bigCw(score);
        drawStr(String(score), W/2, H*0.4874, cw, cw, dark, rgb(bgC,0.62), 2.5);
      }

      var wantShapes = (mode==='classic' || state==='skins' || state==='credits');
      var shapes = new Path2D();
      var zn = Math.ceil((W - ZIG_X0)/ZIG_W) + 1;
      for(var i=0;i<zn;i++){
        var zx0 = ZIG_X0 + i*ZIG_W;
        shapes.moveTo(zx0,0); shapes.lineTo(zx0+ZIG_W/2,ZIG_D); shapes.lineTo(zx0+ZIG_W,0); shapes.closePath();
        shapes.moveTo(zx0,H); shapes.lineTo(zx0+ZIG_W/2,H-ZIG_D); shapes.lineTo(zx0+ZIG_W,H); shapes.closePath();
      }
      ['left','right'].forEach(function(side){
        var base = side==='right' ? W : 0, dx = side==='right' ? -1 : 1;
        spikes[side].forEach(function(s){
          shapes.moveTo(base, s.y - SH/2);
          shapes.lineTo(base, s.y + SH/2);
          shapes.lineTo(base + dx*D*s.ext, s.y);
          shapes.closePath();
        });
      });
      if(menuExt > 0.01){
        var MD = D*menuExt, n = Math.ceil(H/SH)+1;
        for(var j=0;j<n;j++){
          var y0 = j*SH - SH/2;
          shapes.moveTo(0,y0); shapes.lineTo(0,y0+SH); shapes.lineTo(MD,y0+SH/2); shapes.closePath();
          shapes.moveTo(W,y0); shapes.lineTo(W,y0+SH); shapes.lineTo(W-MD,y0+SH/2); shapes.closePath();
        }
      }
      if(wantShapes){ ctx.save(); ctx.translate(0,4); ctx.fillStyle = dark; ctx.fill(shapes); ctx.restore();
      ctx.fillStyle = INK; ctx.fill(shapes); }

      if(star.on && mode==='classic' && (state==='play' || (state==='dead' && !menuShown))){
        var pls = 1.233;
        drawStar(star.x, star.y+2.5, 12*pls, dark);
        drawStar(star.x, star.y,   12*pls, '#ffff00');
      }

      if(mode==='classic' && (state==='play' || state==='ready')) drawCube(p.x, p.y, S, skin, p.dir, dark, sqx());
      else if(mode==='classic' && state==='dead') drawDeadBit(p.x, p.y, S);
    }

    // particles
    particles.forEach(function(q){
      ctx.globalAlpha = clamp(q.life*2,0,1);
      ctx.fillStyle = q.c;
      ctx.fillRect(q.x-q.s/2, q.y-q.s/2, q.s, q.s);
    });
    ctx.globalAlpha = 1;

    if(state==='ready') drawMenu(1,'ready');
    else if(state==='dead' && menuShown) drawMenu(easeOutBack(menuT),'dead');
    else if(state==='skins') drawSkins();
    else if(state==='credits') drawCredits();

    ctx.restore();
  }

  // ---------- loop ----------
  var last = performance.now();
  function frame(now){
    var dt = Math.min((now-last)/1000, 1/30);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  reset();
  requestAnimationFrame(frame);
})();
</script>
