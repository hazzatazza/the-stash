<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Titan+One&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blobby.io</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0f19;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #f4f6fb;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    /* ---------- Menu ---------- */
    :root {
      --bg: #140b24;
      --grid: #1f1336;
      --panel: #1c1133;
      --line: #3a2a61;
      --purple: #8b5cf6;
      --purple-dark: #5b34c4;
      --green: #3ddc6e;
      --green-dark: #1f9d47;
      --text: #ece6ff;
      --muted: #8f82b3;
    }

    .fullscreen-menu {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: 'Fredoka', system-ui, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    /* blobs drifting around in the background, drawn like the in-game cells */
    .bg-blob {
      position: absolute;
      border-radius: 50%;
      border-style: solid;
      border-width: 5px;
      pointer-events: none;
      opacity: 0.9;
      animation: wander 14s ease-in-out infinite alternate;
    }
    .bg-blob::after {
      content: '';
      position: absolute;
      top: 14%;
      left: 20%;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
    }
    .bg-blob.g { background: hsl(140, 70%, 48%); border-color: hsl(140, 70%, 30%); }
    .bg-blob.p { background: hsl(265, 75%, 62%); border-color: hsl(265, 70%, 38%); }
    .bg-blob.b1 { width: 260px; height: 260px; left: -50px;  top: 8%;     animation-duration: 16s; }
    .bg-blob.b2 { width: 110px; height: 110px; left: 17%;    bottom: 10%;  animation-duration: 11s; animation-delay: -3s; }
    .bg-blob.b3 { width: 70px;  height: 70px;  left: 27%;    top: 14%;     animation-duration: 9s;  animation-delay: -6s; }
    .bg-blob.b4 { width: 180px; height: 180px; right: 9%;    top: 12%;     animation-duration: 13s; animation-delay: -2s; }
    .bg-blob.b5 { width: 340px; height: 340px; right: -90px; bottom: -70px; animation-duration: 18s; animation-delay: -8s; }
    .bg-blob.b6 { width: 54px;  height: 54px;  right: 26%;   bottom: 16%;  animation-duration: 8s;  animation-delay: -1s; }
    .bg-blob.b7 { width: 90px;  height: 90px;  left: 8%;     bottom: 34%;  animation-duration: 12s; animation-delay: -5s; }
    @keyframes wander {
      0%   { transform: translate(0, 0); }
      50%  { transform: translate(40px, -30px); }
      100% { transform: translate(-25px, 35px); }
    }

    .menu-panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      margin: auto;
      text-align: center;
    }

    .logo {
      font-family: 'Titan One', 'Fredoka', sans-serif;
      font-weight: 400;
      font-size: clamp(3.6rem, 13vw, 5.6rem);
      line-height: 1;
      color: #9b6bff;
      -webkit-text-stroke: 9px #12062b;
      paint-order: stroke fill;
      letter-spacing: 1px;
      margin-bottom: 18px;
      filter: drop-shadow(0 5px 0 #12062b);
    }
    .logo span { color: var(--green); }

    .box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      text-align: left;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .name-input, .play-btn, .theme-btn, .diff-btn, .link-btn { font-family: inherit; }
    .name-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #120a21;
      color: var(--text);
      font-size: 17px;
      text-align: center;
      outline: none;
      user-select: text;
    }
    .name-input::placeholder { color: var(--muted); }
    .name-input:focus { border-color: var(--purple); }

    .play-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: var(--green);
      color: #052e16;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--green-dark);
      transition: transform 0.06s, box-shadow 0.06s, filter 0.1s;
    }
    .play-btn:hover { filter: brightness(1.08); }
    .play-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--green-dark); }

    /* settings rows */
    .settings {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .form-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .form-group:last-child { margin-bottom: 0; }
    .form-label {
      font-size: 13px;
      color: var(--muted);
      flex: 0 0 auto;
      min-width: 60px;
    }
    .color-picker-wrapper { display: flex; align-items: center; gap: 8px; }
    .color-picker {
      -webkit-appearance: none;
      appearance: none;
      width: 32px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: none;
      cursor: pointer;
    }
    .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker::-webkit-color-swatch { border: none; border-radius: 3px; }
    .color-picker::-moz-color-swatch { border: none; border-radius: 3px; }
    .color-label {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .grid-selector { display: flex; }
    .theme-btn, .diff-btn {
      padding: 5px 10px;
      border: 1px solid var(--line);
      margin-left: -1px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }
    .theme-btn:first-child, .diff-btn:first-child { margin-left: 0; border-radius: 4px 0 0 4px; }
    .theme-btn:last-child, .diff-btn:last-child { border-radius: 0 4px 4px 0; }
    .theme-btn:hover, .diff-btn:hover { color: var(--text); }
    .theme-btn.active, .diff-btn.active {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
      position: relative;
    }

    .menu-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .link-btn {
      border: none;
      background: none;
      padding: 0;
      color: var(--muted);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
    }
    .link-btn:hover { color: var(--text); }

    .controls-hint {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .controls-hint b {
      display: inline-block;
      padding: 1px 7px;
      margin: 0 2px;
      border: 1px solid var(--line);
      border-bottom-width: 3px;
      border-radius: 4px;
      background: var(--panel);
      color: var(--text);
      font-weight: 600;
      font-size: 12px;
    }

    /* credits */
    .credits-box { text-align: center; line-height: 1.8; font-size: 15px; padding: 6px 0 4px; }
    .credits-box a { color: var(--green); text-decoration: none; font-weight: 600; }
    .credits-box a:hover { text-decoration: underline; }
    .credits-box .orig { margin-top: 10px; font-size: 13px; color: var(--muted); }
    .credits-box .link-btn { margin-top: 14px; }
    .algebra-logo { height: 22px; vertical-align: middle; margin: 0 4px; display: inline-block; }



    /* ---------- Skin picker ---------- */
    .skin-picker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin: 16px 0 4px;
    }
    .skin-preview {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #1b6b3a;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-sizing: border-box;
    }
    .skin-preview.solid::after {
      content: '';
      position: absolute;
      top: 14%;
      left: 20%;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
    }
    .skin-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    .skin-arrow:hover { background: var(--purple); border-color: var(--purple); }
    .skin-arrow:active { transform: scale(0.92); }
    .skin-name { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
    @media (max-height: 640px) {
      .skin-picker { margin: 10px 0 2px; }
      .skin-preview { width: 52px; height: 52px; }
    }

    /* ---------- Pause / game over / pause button ---------- */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 5, 22, 0.72);
      font-family: 'Fredoka', system-ui, sans-serif;
      color: var(--text);
      padding: 20px;
    }
    .overlay .box { width: 100%; max-width: 340px; text-align: center; }
    .overlay h2 {
      font-family: 'Titan One', 'Fredoka', sans-serif;
      font-weight: 400;
      font-size: 34px;
      color: #9b6bff;
      -webkit-text-stroke: 5px #12062b;
      paint-order: stroke fill;
      margin-bottom: 12px;
    }
    .over-label { font-size: 12px; letter-spacing: 1px; color: var(--muted); }
    .over-size {
      font-family: 'Titan One', 'Fredoka', sans-serif;
      font-size: 64px;
      line-height: 1.1;
      color: var(--green);
    }
    .over-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .overlay .play-btn { margin-top: 18px; }
    .ghost-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }
    .ghost-btn:hover { background: #2a1a4a; border-color: var(--purple); }
    .opt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
      text-align: left;
    }
    .tog {
      min-width: 64px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .tog.on { background: var(--purple); border-color: var(--purple); color: #fff; }
    .pause-hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
    #pause-btn {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(20, 11, 36, 0.8);
      cursor: pointer;
    }
    #pause-btn i { display: block; width: 5px; height: 16px; border-radius: 2px; background: var(--text); }
    #pause-btn:hover { background: var(--purple-dark); }

    @media (max-height: 640px) {
      .logo { font-size: 3.4rem; margin-bottom: 12px; -webkit-text-stroke-width: 7px; }
      .box { padding: 14px; }
      .settings { margin-top: 12px; padding-top: 10px; }
      .form-group { margin-bottom: 6px; }
      .controls-hint { margin-top: 10px; }
    }
    @media (max-height: 520px) {
      .menu-panel { transform: scale(0.8); transform-origin: center; }
    }
    @media (max-width: 700px) {
      .bg-blob.b1, .bg-blob.b5 { opacity: 0.5; }
      .fullscreen-menu { padding: 14px; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas"></canvas>
    
    <!-- Menu -->
    <div id="menu-ui" class="fullscreen-menu">
      <div class="bg-blob g b1"></div>
      <div class="bg-blob p b2"></div>
      <div class="bg-blob g b3"></div>
      <div class="bg-blob p b4"></div>
      <div class="bg-blob g b5"></div>
      <div class="bg-blob p b6"></div>
      <div class="bg-blob g b7"></div>

      <div class="menu-panel">
        <h1 class="logo">Blobby<span>.io</span></h1>

        <div class="box">
          <div id="tab-play" class="tab-content active">
            <input type="text" id="player-name-input" class="name-input" placeholder="Nickname" maxlength="15">
            <div class="skin-picker">
              <button class="skin-arrow" onclick="cycleSkin(-1)" aria-label="Previous skin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
              <div class="skin-preview solid" id="skin-preview"></div>
              <button class="skin-arrow" onclick="cycleSkin(1)" aria-label="Next skin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
            </div>
            <div class="skin-name" id="skin-name">Solid colour</div>
            <button class="play-btn" onclick="startGame()">Play</button>

            <div class="settings">
              <div class="form-group">
                <span class="form-label">Colour</span>
                <div class="color-picker-wrapper">
                  <span class="color-label" id="color-hex-text">#3b82f6</span>
                  <input type="color" id="player-color-picker" class="color-picker" value="#3b82f6">
                </div>
              </div>
              <div class="form-group">
                <span class="form-label">Map</span>
                <div class="grid-selector" id="theme-selector">
                  <button class="theme-btn active" onclick="setTheme('Light')">Light</button>
                  <button class="theme-btn" onclick="setTheme('Dark')">Dark</button>
                  <button class="theme-btn" onclick="setTheme('Neon')">Neon</button>
                  <button class="theme-btn" onclick="setTheme('Retro')">Retro</button>
                </div>
              </div>
              <div class="form-group">
                <span class="form-label">Bots</span>
                <div class="grid-selector">
                  <button class="diff-btn" onclick="setDiff('Easy')">Easy</button>
                  <button class="diff-btn active" id="btn-Normal" onclick="setDiff('Normal')">Normal</button>
                  <button class="diff-btn" onclick="setDiff('Hard')">Hard</button>
                </div>
              </div>
            </div>

            <div class="menu-foot">
              <span id="best-score-text">Best size 0</span>
              <button class="link-btn" onclick="switchTab('credits')">Credits</button>
            </div>
          </div>

          <div id="tab-credits" class="tab-content">
            <div class="credits-box">
              <p>Based on Blob Rush by <a href="https://games.yakton.net" target="_blank">Yakton Games</a></p>
              <p>Made by Hazza</p>
              <div class="orig">an <img src="https://i.ibb.co/krpP9zq/algebralogo.png" alt="algebra practise" class="algebra-logo"> original</div>
              <button class="link-btn" onclick="switchTab('play')">Back</button>
            </div>
          </div>
        </div>

        <p class="controls-hint">Move with mouse &middot; <b>Space</b> split &middot; <b>W</b> feed &middot; hide behind green viruses</p>
        <span id="status-text" style="display:none"></span>
      </div>
    </div>

    <button id="pause-btn" title="Pause (Esc)" onclick="pauseGame()"><i></i><i></i></button>

    <div id="pause-ui" class="overlay">
      <div class="box">
        <h2>Paused</h2>
        <div class="opt-row"><span>Minimap</span><button class="tog on" id="tog-minimap" onclick="toggleOpt('minimap')">On</button></div>
        <div class="opt-row"><span>Music</span><button class="tog on" id="tog-music" onclick="toggleOpt('music')">On</button></div>
        <div class="opt-row"><span>Sound effects</span><button class="tog on" id="tog-sfx" onclick="toggleOpt('sfx')">On</button></div>
        <button class="play-btn" onclick="resumeGame()">Resume</button>
        <button class="ghost-btn" onclick="leaveGame()">Leave game</button>
        <p class="pause-hint">Esc to resume</p>
      </div>
    </div>

    <div id="over-ui" class="overlay">
      <div class="box">
        <h2>You were eaten</h2>
        <div class="over-label">BIGGEST SIZE</div>
        <div class="over-size" id="over-size">0</div>
        <div class="over-sub" id="over-best"></div>
        <div class="over-sub" id="over-stats"></div>
        <button class="play-btn" onclick="retryGame()">Try again</button>
        <button class="ghost-btn" onclick="toMenu()">Back to menu</button>
      </div>
    </div>
  </div>

  <script>
    let W = window.innerWidth;
    let H = window.innerHeight;

    const THEMES = {
      Light: { bg: '#f4f6fb', grid: '#d9dfec', border: '#8791b4', void: '#c7cde0', text: '#fff' },
      Dark:  { bg: '#0b0f19', grid: '#1e293b', border: '#334155', void: '#020617', text: '#fff' },
      Neon:  { bg: '#090014', grid: '#260042', border: '#a855f7', void: '#030008', text: '#fff' },
      Retro: { bg: '#2b1d0c', grid: '#443019', border: '#855b28', void: '#170f05', text: '#fff' }
    };

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase() === tabName);
      });
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.toggle('active', content.id === 'tab-' + tabName);
      });
    }

    function hd(el, w, h, dpr) {
      const c = document.getElementById('canvas');
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      const ctx = c.getContext('2d');
      return [c, ctx];
    }
    function on(el, ev, fn) { el.addEventListener(ev, fn); }
    function st(txt) { 
      const s = document.getElementById('status-text');
      if (s) s.innerText = txt;
    }
    function best(name, val) {
      const k = 'best-' + name;
      const cur = +localStorage.getItem(k) || 0;
      if (val > cur) {
        localStorage.setItem(k, val);
        return val;
      }
      return cur;
    }
    const OPT = (() => {
      const d = { sfx: true, music: true, minimap: true };
      try { Object.assign(d, JSON.parse(localStorage.getItem('blobs-opt') || '{}')) } catch (e) {}
      return d;
    })();
    function saveOpt() { try { localStorage.setItem('blobs-opt', JSON.stringify(OPT)) } catch (e) {} }

    // All sound is synthesised with WebAudio, so there are no audio files to load.
    const AudioFX = (() => {
      let ctx = null, sfx = null, mus = null, noiseBuf = null, timer = null, nextT = 0, step = 0;
      function ensure() {
        if (!ctx) {
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            ctx = new AC();
            sfx = ctx.createGain(); sfx.gain.value = 0.5; sfx.connect(ctx.destination);
            mus = ctx.createGain(); mus.gain.value = 0.11; mus.connect(ctx.destination);
            noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.3), ctx.sampleRate);
            const d = noiseBuf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          } catch (e) { ctx = null }
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
        return ctx;
      }
      function tone(dest, t0, f0, f1, dur, type, vol) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f0, t0);
        if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(dest); o.start(t0); o.stop(t0 + dur + 0.03);
      }
      function burst(dest, t0, dur, vol, cutoff) {
        const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
        s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = cutoff;
        g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        s.connect(f); f.connect(g); g.connect(dest); s.start(t0); s.stop(t0 + dur + 0.03);
      }
      const SFX = {
        tick:  t => tone(sfx, t, 520, 820, 0.06, 'sine', 0.25),
        ui:    t => tone(sfx, t, 600, 900, 0.07, 'sine', 0.2),

    function hexToHue(hex) {
      let c = hex.replace('#','');

      if (max === min) {

      } else {

        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);

              if (cb.dead || !BLOB.canEat(ca, cb)) continue;
              ca.m += cb.m; cb.dead = true;
              if (a === me) { eaten++; fxs('coin'); popups.push({ t: 0, x: cb.x, y: cb.y, s: '+' + Math.round(cb.m), c: '#3ddc6e' }); if (!b.cells.some(q => !q.dead)) popups.push({ t: 0, x: cb.x, y: cb.y - 26, s: 'ate ' + b.name, c: '#fff' }) }
              if (b === me && !b.cells.some(q => !q.dead)) { popups.push({ t: 0, x: ca.x, y: ca.y, s: a.name + ' ate you', c: '#ff6b5b' }); fxs('lose'); }
              if (!b.cells.some(q => !q.dead)) a.kills++;
            }
          }
        }
        P.forEach(p => { const had = p.cells.length; p.cells = p.cells.filter(cl => !cl.dead); if (p.bot && had && !p.cells.length) p.respawn = 3 + Math.random() * 3 });
        if (me.cells.length) {
          const T = tot(me); peak = Math.max(peak, Math.round(T));
          let cx = 0, cy = 0, mm = 0; me.cells.forEach(q => { cx += q.x * q.m; cy += q.y * q.m; mm += q.m }); cx /= mm; cy /= mm;
          cam.x += (cx - cam.x) * Math.min(1, dt * 6); cam.y += (cy - cam.y) * Math.min(1, dt * 6);
          const spread = Math.max(...me.cells.map(q => Math.hypot(q.x - cx, q.y - cy) + R(q.m)));
          cam.z += (Math.min(BLOB.zoomFor(T), (Math.min(W, H) * .42) / Math.max(spread, 60)) - cam.z) * Math.min(1, dt * 2.5);
          st(`Mass ${Math.round(T)}   Best ${Math.max(bestNow(), peak)}`);
        } else {
          deadT += dt;
          if (deadT > 1.1) finish();
        }
        popups.forEach(q => q.t += dt); popups = popups.filter(q => q.t < 1.2);
      }

      function finish() {
        scr = 'over'; overT = 0; newBest = peak > bestNow(); const b = best('blobs', peak);
        AudioFX.sync(false);
        const secs = Math.floor(life % 60);
        byId('over-size').innerText = peak;
        byId('over-best').innerText = newBest ? 'New best!' : 'Best ' + b;
        byId('over-stats').innerText = `Blobs eaten ${eaten}  ·  Time ${Math.floor(life / 60)}:${String(secs).padStart(2, '0')}`;
        st(`You were eaten. Biggest size ${peak}. Best ${b}.`);
      }

      const getBtnPos = () => ({ split: { x: W - 52, y: H - 52, r: 34 }, feed: { x: W - 52, y: H - 130, r: 26 } });
      function pos(e) { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H] }
      const hit = (b, px, py) => Math.hypot(px - b.x, py - b.y) < b.r + 8;
      on(c, 'pointerdown', e => {
        e.preventDefault(); const [px, py] = pos(e);
        if (scr == 'menu') return;
        if (scr == 'over') return;
        if (e.pointerType != 'mouse') touch = true;
        const btn = getBtnPos();
        if (me.cells.length) {
          if (hit(btn.split, px, py)) { split(me); return }
          if (hit(btn.feed, px, py)) { feed(me); return }
        }
        ptr.x = px; ptr.y = py;
        try { c.setPointerCapture(e.pointerId) } catch(_) {}
      });
      on(c, 'pointermove', e => { const [px, py] = pos(e); ptr.x = px; ptr.y = py });
      on(document, 'keydown', e => {
        if (document.activeElement === nameInput) return;
        const k = e.key.toLowerCase();
        if (e.key == 'Escape' || k == 'p') {
          if (scr == 'play' && me && me.cells.length) { paused ? resumeGame() : pauseGame() }
          return;
        }
        if (paused) return;
        if (e.key == ' ') {
          e.preventDefault();
          if (scr == 'play' && !e.repeat && me.cells.length) split(me);
          else if (scr == 'menu') startGame();
          else if (scr == 'over' && overT > .7 && !e.repeat && e.target.tagName != 'BUTTON') begin();
        }
        else if (k == 'w' && scr == 'play') { if (!e.repeat && me.cells.length) feed(me) }
        else if (k.startsWith('arrow') || k == 'a' || k == 'd' || k == 's') { keys[k] = 1; if (k.startsWith('arrow')) e.preventDefault() }
      });
      on(document, 'keyup', e => { delete keys[e.key.toLowerCase()] });

      const S = (wx, wy) => [(wx - cam.x) * cam.z + W / 2, (wy - cam.y) * cam.z + H / 2];

      const VR = m => Math.sqrt(m) * 8.5;
      function drawVirus(v) {
        const [sx, sy] = S(v.x, v.y), r = VR(v.m) * cam.z;
        if (sx < -r || sx > W + r || sy < -r || sy > H + r) return;
        
        const points = 36;
        x.fillStyle = '#2eff2e';
        x.strokeStyle = '#1fb824';
        x.lineWidth = Math.max(4, 7 * cam.z);
        x.lineJoin = 'miter';
        x.beginPath();
        for (let i = 0; i < points; i++) {
          const angle = (i / points) * Math.PI * 2;
          const dist = (i % 2 === 0) ? r : r * 0.93;
          const px = sx + Math.cos(angle) * dist;
          const py = sy + Math.sin(angle) * dist;
          if (i === 0) x.moveTo(px, py);
          else x.lineTo(px, py);
        }
        x.closePath();
        x.fill();
        x.stroke();
      }

      const darker = h => `hsl(${h},75%,28%)`;
      function drawCell(cl, p, isMe) {
        const [sx, sy] = S(cl.x, cl.y), r = R(cl.m) * cam.z;
        if (sx < -r || sx > W + r || sy < -r || sy > H + r) return;
        
        const numPts = 64; // High resolution circle for perfectly smooth curves
        const extraWobble = (cl.wobble || 0) * r * 0.08;
        const baseAmp = Math.max(0.5, r * 0.012) + extraWobble;
        
        // Smooth organic jelly blob path
        x.beginPath();
        for (let i = 0; i <= numPts; i++) {
          const angle = (i / numPts) * Math.PI * 2;
          const wobble = Math.sin(angle * 4 + tm * 5 + (cl.x * 0.005)) * baseAmp 
                      + Math.cos(angle * 3 - tm * 4 + (cl.y * 0.005)) * (baseAmp * 0.5);
          const pr = Math.max(2, r + wobble);
          const px = sx + Math.cos(angle) * pr;
          const py = sy + Math.sin(angle) * pr;
          if (i === 0) x.moveTo(px, py);
          else x.lineTo(px, py);
        }
        x.closePath();
        
        // Slightly darker stroke/outline
        x.fillStyle = hue(p.h);
        x.strokeStyle = darker(p.h);
        x.lineWidth = Math.max(3, Math.min(8, r * 0.08 * cam.z));
        x.fill();
        const skinImg = skinReady(p.skin);
        if (skinImg) {
          x.save(); x.clip();
          const sw = skinImg.naturalWidth, sh = skinImg.naturalHeight, sd = Math.min(sw, sh);
          x.drawImage(skinImg, (sw - sd) / 2, (sh - sd) / 2, sd, sd, sx - r, sy - r, r * 2, r * 2);
          x.restore();
        }
        x.stroke();
        
        // Inner subtle sheen highlight
        x.fillStyle = skinImg ? '#ffffff00' : '#ffffff25'; 
        x.beginPath(); 
        x.arc(sx - r * .26, sy - r * .28, r * .32, 0, Math.PI * 2); 
        x.fill();

        if (r > 13) {
          x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.lineJoin = 'round'; x.strokeStyle = '#12062bcc'; x.fillStyle = '#fff';
          const fs = Math.max(11, Math.min(26, r * .42)); x.font = `700 ${fs}px Fredoka, system-ui`; x.lineWidth = fs * .18;
          
          x.strokeText(p.name, sx, sy + fs * .1); x.fillText(p.name, sx, sy + fs * .1);
          
          if (r > 26) {
            x.font = `600 ${fs * .6}px Fredoka, system-ui`; x.lineWidth = 3; const t = String(Math.round(cl.m)); 
            x.strokeText(t, sx, sy + fs * .9); x.fillText(t, sx, sy + fs * .9);
          }
        }
      }

      function drawMinimap() {
        const size = Math.round(Math.max(110, Math.min(170, Math.min(W, H) * .26))), mx = 12, my = H - size - 12, k = size / WORLD;
        x.save();
        x.fillStyle = 'rgba(20,11,36,.78)'; rr(x, mx, my, size, size, 10); x.fill();
        rr(x, mx, my, size, size, 10); x.clip();
        x.fillStyle = '#3ddc6e';
        viruses.forEach(v => { x.beginPath(); x.arc(mx + v.x * k, my + v.y * k, 2, 0, 7); x.fill() });
        P.forEach(p => {
          if (p === me) return;
          x.fillStyle = hue(p.h);
          p.cells.forEach(cl => { x.beginPath(); x.arc(mx + cl.x * k, my + cl.y * k, Math.max(2, R(cl.m) * k), 0, 7); x.fill() });
        });
        x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 1;
        x.strokeRect(mx + (cam.x - W / 2 / cam.z) * k, my + (cam.y - H / 2 / cam.z) * k, W / cam.z * k, H / cam.z * k);
        me.cells.forEach(cl => {
          x.beginPath(); x.arc(mx + cl.x * k, my + cl.y * k, Math.max(2.5, R(cl.m) * k), 0, 7);
          x.fillStyle = hue(me.h); x.fill(); x.strokeStyle = '#fff'; x.lineWidth = 1.5; x.stroke();
        });
        x.restore();
        x.strokeStyle = '#3a2a61'; x.lineWidth = 1.5; rr(x, mx, my, size, size, 10); x.stroke();
      }

      function draw() {
        syncMenu();
        if (scr == 'menu') return;
        
        const theme = THEMES[selectedTheme] || THEMES.Light;
        x.fillStyle = theme.bg; x.fillRect(0, 0, W, H);

        const gs = 60 * cam.z; if (gs > 8) {
          x.strokeStyle = theme.grid; x.lineWidth = 1; x.beginPath();
          const ox = ((-cam.x * cam.z + W / 2) % gs + gs) % gs, oy = ((-cam.y * cam.z + H / 2) % gs + gs) % gs;
          for (let gx = ox; gx < W; gx += gs) { x.moveTo(gx, 0); x.lineTo(gx, H) } for (let gy = oy; gy < H; gy += gs) { x.moveTo(0, gy); x.lineTo(W, gy) } x.stroke();
        }

        const [ax, ay] = S(0, 0), [bx, by] = S(WORLD, WORLD);
        x.fillStyle = theme.void; x.fillRect(0, 0, W, Math.max(0, ay)); x.fillRect(0, Math.min(H, by), W, H); x.fillRect(0, 0, Math.max(0, ax), H); x.fillRect(Math.min(W, bx), 0, W, H);
        x.strokeStyle = theme.border; x.lineWidth = 3; x.strokeRect(ax, ay, bx - ax, by - ay);

        pel.forEach(o => { const [sx, sy] = S(o.x, o.y); if (sx < -8 || sx > W + 8 || sy < -8 || sy > H + 8) return;
          x.fillStyle = hue(o.h); x.beginPath(); x.arc(sx, sy, Math.max(2, (o.big ? 7 : 4) * cam.z + 1), 0, 7); x.fill() });

        // Draw all player/bot cells first
        P.forEach(p => p.cells.forEach(cl => drawCell(cl, p, p === me)));
        // Draw viruses on top of blobs so hiding blobs are hidden underneath
        viruses.forEach(v => drawVirus(v));

        popups.forEach(q => { const [sx, sy] = S(q.x, q.y); x.globalAlpha = Math.max(0, 1 - q.t / 1.2); x.textAlign = 'center'; x.font = '700 18px Fredoka, system-ui'; x.lineWidth = 4; x.strokeStyle = '#12062bcc'; x.lineJoin = 'round'; x.strokeText(q.s, sx, sy - q.t * 40); x.fillStyle = q.c; x.fillText(q.s, sx, sy - q.t * 40); x.globalAlpha = 1 });

        const T = me.cells.length ? Math.round(tot(me)) : 0;
        const panel = (px, py, pw, ph) => {
          x.fillStyle = 'rgba(20,11,36,.78)'; rr(x, px, py, pw, ph, 8); x.fill();
          x.strokeStyle = '#3a2a61'; x.lineWidth = 1.5; rr(x, px, py, pw, ph, 8); x.stroke();
        };
        panel(10, 10, 160, 52);
        x.textAlign = 'left'; x.fillStyle = '#8f82b3'; x.font = '600 11px Fredoka, system-ui'; x.fillText('SIZE', 22, 29);
        x.fillStyle = '#3ddc6e'; x.font = '26px "Titan One", Fredoka, system-ui'; x.fillText(String(T), 22, 53);
        x.textAlign = 'right'; x.fillStyle = '#8f82b3'; x.font = '600 11px Fredoka, system-ui'; x.fillText('BEST ' + Math.max(bestNow(), peak), 158, 29);

        const all = P.filter(p => p.cells.length).map(p => ({ n: p.name, m: tot(p), me: p === me })).sort((a, b) => b.m - a.m);
        const myRank = all.findIndex(q => q.me);
        const lb = all.slice(0, 6).map((q, i) => ({ ...q, rank: i + 1 }));
        if (myRank >= 6) lb.push({ ...all[myRank], rank: myRank + 1 });
        panel(W - 182, 10, 172, 36 + lb.length * 21);
        x.textAlign = 'left'; x.fillStyle = '#8f82b3'; x.font = '600 11px Fredoka, system-ui'; x.fillText('LEADERBOARD', W - 170, 29);
        lb.forEach((q, i) => {
          x.fillStyle = q.me ? '#3ddc6e' : '#ece6ff'; x.font = (q.me ? '700' : '500') + ' 14px Fredoka, system-ui';
          x.textAlign = 'left'; x.fillText(`${q.rank}. ${q.n}`, W - 170, 52 + i * 21);
          x.textAlign = 'right'; x.fillText(String(Math.round(q.m)), W - 22, 52 + i * 21);
        });

        if (OPT.minimap && scr == 'play') drawMinimap();

        if (touch && me.cells.length) {
          const btn = getBtnPos();
          [[btn.split, 'SPLIT'], [btn.feed, 'FEED']].renderables = [[btn.split, 'SPLIT'], [btn.feed, 'FEED']].forEach(([b, t]) => { x.fillStyle = 'rgba(20,11,36,.8)'; x.beginPath(); x.arc(b.x, b.y, b.r, 0, 7); x.fill(); x.strokeStyle = '#3ddc6e'; x.lineWidth = 2; x.stroke(); x.fillStyle = '#fff'; x.textAlign = 'center'; x.font = '700 12px Fredoka, system-ui'; x.fillText(t, b.x, b.y + 4) });
        }

        if (!me.cells.length && scr == 'play') { x.fillStyle = '#0008'; x.fillRect(0, 0, W, H) }
        if (scr == 'over') { x.fillStyle = 'rgba(10,5,22,.65)'; x.fillRect(0, 0, W, H) }
      }

      const byId = id => document.getElementById(id);
      const syncMenu = () => {
        const m = scr == 'menu';
        c.style.display = m ? 'none' : 'block';
        byId('menu-ui').style.display = m ? 'flex' : 'none';
        byId('over-ui').style.display = scr == 'over' ? 'flex' : 'none';
        byId('pause-ui').style.display = scr == 'play' && paused ? 'flex' : 'none';
        byId('pause-btn').style.display = scr == 'play' && !paused && me && me.cells.length ? 'flex' : 'none';
      };

      window.setDiff = function(d) {
        diff = d;
        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        try { localStorage.setItem('blobs-diff', diff) } catch(_) {}
      };

      window.startGame = function() {
        begin();
      };

      const unfocus = () => { if (document.activeElement && document.activeElement.blur) document.activeElement.blur() };
      const refreshOptUI = () => {
        ['minimap', 'music', 'sfx'].forEach(n => {
          const b = byId('tog-' + n);
          b.classList.toggle('on', !!OPT[n]);
          b.innerText = OPT[n] ? 'On' : 'Off';
        });
      };
      window.toggleOpt = function(n) {
        OPT[n] = !OPT[n]; saveOpt(); refreshOptUI(); unfocus();
        if (n == 'music') AudioFX.sync(scr == 'play');
        if (n == 'sfx' && OPT.sfx) fxs('ui');
      };
      window.pauseGame = function() {
        if (scr != 'play' || !me || !me.cells.length) return;
        paused = true; refreshOptUI(); unfocus(); syncMenu();
      };
      window.resumeGame = function() { paused = false; unfocus(); syncMenu() };
      window.retryGame = function() { unfocus(); begin(); syncMenu() };
      window.toMenu = function() {
        scr = 'menu'; paused = false; unfocus();
        AudioFX.sync(false);
        byId('best-score-text').innerText = 'Best size ' + bestNow();
        st('Pick your setup and press Play.');
        syncMenu();
      };
      window.leaveGame = function() {
        try { best('blobs', peak) } catch (e) {}
        window.toMenu();
      };
      const refreshSkinUI = () => {
        const h = hexToHue(colorPicker.value), pv = byId('skin-preview');
        pv.style.backgroundColor = hue(h);
        pv.style.borderColor = darker(h);
        pv.style.backgroundImage = selectedSkin ? `url(${SKIN_URL(selectedSkin)})` : 'none';
        pv.classList.toggle('solid', !selectedSkin);
        byId('skin-name').innerText = selectedSkin ? selectedSkin[0].toUpperCase() + selectedSkin.slice(1) : 'Solid colour';
      };
      window.cycleSkin = function(d) {
        const opts = [''].concat(SKINS), i = opts.indexOf(selectedSkin);
        selectedSkin = opts[(i + d + opts.length) % opts.length];
        try { localStorage.setItem('blobs-skin', selectedSkin) } catch(e) {}
        refreshSkinUI(); unfocus(); fxs('click');
      };
      refreshOptUI();
      refreshSkinUI();

      document.getElementById('best-score-text').innerText = 'Best size ' + bestNow();
      syncMenu();
      st('Pick your setup and press Play.');
      return gloop(upd, draw);
    }

    window.onload = () => blobs(document.getElementById('game-container'));
  </script>
</body>
</html>
