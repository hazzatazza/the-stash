<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        overflow: hidden;
        background: #000000;
        margin: 0;
        color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        text-align: center;
      }

      #startButton {
        display: block;
        width: 180px;
        height: 55px;
        background: linear-gradient(135deg, #8A2BE2, #00FF7F);
        color: white;
        text-align: center;
        text-decoration: none;
        font-size: 24px;
        padding: 10px 20px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-family: "Chewy", cursive;
        box-shadow: 0px 4px 15px rgba(0, 255, 127, 0.4);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      #startButton:hover {
        transform: scale(1.05);
        box-shadow: 0px 6px 20px rgba(138, 43, 226, 0.6);
      }

      #introImage {
        max-width: 250px;
        height: auto;
        display: block;
      }

      #game {
        width: 100vw;
        height: 100vh;
      }
    </style>
    <!-- Import Chewy font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <div id="game" style="display: none;"></div>
      
      <button id="startButton">PLAY</button>
      <img id="introImage" src="https://iili.io/q4IJf9a.png" alt="Intro Image">
    </div>

    <script>
      function startGame() {
        // Hide the button and image container layout, show the game view
        document.querySelector(".container").style.display = "block";
        document.getElementById("game").style.display = "block";
        document.getElementById("startButton").style.display = "none";
        document.getElementById("introImage").style.display = "none";
        
        window.EJS_player = "#game";
        window.EJS_core = "nes";
        window.EJS_color = "#000000";
        window.EJS_startOnLoaded = true;
        window.EJS_pathtodata = "https://cdn.jsdelivr.net/gh/hazzatazza/the-stash@main/emulated%20stuff/emujs/";
        window.EJS_gameUrl = "https://cdn.jsdelivr.net/gh/hazzatazza/stuff-it-emu@main/Famidash.v1.2.8.nes";
        
        loadGame();
      }

      document.getElementById("startButton").addEventListener("click", startGame);

      function loadGame() {
        var script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/gh/hazzatazza/the-stash@main/emulated%20stuff/emujs/loader.js";
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
