<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Titan+One&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blobby.io</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0f19;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #f4f6fb;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    /* ---------- Menu ---------- */
    :root {
      --bg: #140b24;
      --grid: #1f1336;
      --panel: #1c1133;
      --line: #3a2a61;
      --purple: #8b5cf6;
      --purple-dark: #5b34c4;
      --green: #3ddc6e;
      --green-dark: #1f9d47;
      --text: #ece6ff;
      --muted: #8f82b3;
    }

    .fullscreen-menu {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: 'Fredoka', system-ui, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    /* blobs drifting around in the background, drawn like the in-game cells */
    .bg-blob {
      position: absolute;
      border-radius: 50%;
      border-style: solid;
      border-width: 5px;
      pointer-events: none;
      opacity: 0.9;
      animation: wander 14s ease-in-out infinite alternate;
    }
    .bg-blob::after {
      content: '';
      position: absolute;
      top: 14%;
      left: 20%;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
    }
    .bg-blob.g { background: hsl(140, 70%, 48%); border-color: hsl(140, 70%, 30%); }
    .bg-blob.p { background: hsl(265, 75%, 62%); border-color: hsl(265, 70%, 38%); }
    .bg-blob.b1 { width: 260px; height: 260px; left: -50px;  top: 8%;     animation-duration: 16s; }
    .bg-blob.b2 { width: 110px; height: 110px; left: 17%;    bottom: 10%;  animation-duration: 11s; animation-delay: -3s; }
    .bg-blob.b3 { width: 70px;  height: 70px;  left: 27%;    top: 14%;     animation-duration: 9s;  animation-delay: -6s; }
    .bg-blob.b4 { width: 180px; height: 180px; right: 9%;    top: 12%;     animation-duration: 13s; animation-delay: -2s; }
    .bg-blob.b5 { width: 340px; height: 340px; right: -90px; bottom: -70px; animation-duration: 18s; animation-delay: -8s; }
    .bg-blob.b6 { width: 54px;  height: 54px;  right: 26%;   bottom: 16%;  animation-duration: 8s;  animation-delay: -1s; }
    .bg-blob.b7 { width: 90px;  height: 90px;  left: 8%;     bottom: 34%;  animation-duration: 12s; animation-delay: -5s; }
    @keyframes wander {
      0%   { transform: translate(0, 0); }
      50%  { transform: translate(40px, -30px); }
      100% { transform: translate(-25px, 35px); }
    }

    .menu-panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      margin: auto;
      text-align: center;
    }

    .logo {
      font-family: 'Titan One', 'Fredoka', sans-serif;
      font-weight: 400;
      font-size: clamp(3.6rem, 13vw, 5.6rem);
      line-height: 1;
      color: #9b6bff;
      -webkit-text-stroke: 9px #12062b;
      paint-order: stroke fill;
      letter-spacing: 1px;
      margin-bottom: 18px;
      filter: drop-shadow(0 5px 0 #12062b);
    }
    .logo span { color: var(--green); }

    .box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      text-align: left;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .name-input, .play-btn, .theme-btn, .diff-btn, .link-btn { font-family: inherit; }
    .name-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #120a21;
      color: var(--text);
      font-size: 17px;
      text-align: center;
      outline: none;
      user-select: text;
    }
    .name-input::placeholder { color: var(--muted); }
    .name-input:focus { border-color: var(--purple); }

    .play-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: var(--green);
      color: #052e16;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--green-dark);
      transition: transform 0.06s, box-shadow 0.06s, filter 0.1s;
    }
    .play-btn:hover { filter: brightness(1.08); }
    .play-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--green-dark); }

    /* settings rows */
    .settings {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .form-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .form-group:last-child { margin-bottom: 0; }
    .form-label {
      font-size: 13px;
      color: var(--muted);
      flex: 0 0 auto;
      min-width: 60px;
    }
    .color-picker-wrapper { display: flex; align-items: center; gap: 8px; }
    .color-picker {
      -webkit-appearance: none;
      appearance: none;
      width: 32px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: none;
      cursor: pointer;
    }
    .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker::-webkit-color-swatch { border: none; border-radius: 3px; }
    .color-picker::-moz-color-swatch { border: none; border-radius: 3px; }
    .color-label {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .grid-selector { display: flex; }
    .theme-btn, .diff-btn {
      padding: 5px 10px;
      border: 1px solid var(--line);
      margin-left: -1px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }
    .theme-btn:first-child, .diff-btn:first-child { margin-left: 0; border-radius: 4px 0 0 4px; }
    .theme-btn:last-child, .diff-btn:last-child { border-radius: 0 4px 4px 0; }
    .theme-btn:hover, .diff-btn:hover { color: var(--text); }
    .theme-btn.active, .diff-btn.active {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
      position: relative;
    }

    .menu-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .link-btn {
      border: none;
      background: none;
      padding: 0;
      color: var(--muted);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
    }
    .link-btn:hover { color: var(--text); }

    .controls-hint {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .controls-hint b {
      display: inline-block;
      padding: 1px 7px;
      margin: 0 2px;
      border: 1px solid var(--line);
      border-bottom-width: 3px;
      border-radius: 4px;
      background: var(--panel);
      color: var(--text);
      font-weight: 600;
      font-size: 12px;
    }

    /* credits */
    .credits-box { text-align: center; line-height: 1.8; font-size: 15px; padding: 6px 0 4px; }
    .credits-box a { color: var(--green); text-decoration: none; font-weight: 600; }
    .credits-box a:hover { text-decoration: underline; }
    .credits-box .orig { margin-top: 10px; font-size: 13px; color: var(--muted); }
    .credits-box .link-btn { margin-top: 14px; }
    .algebra-logo { height: 22px; vertical-align: middle; margin: 0 4px; display: inline-block; }



    /* ---------- Skin picker ---------- */
    .skin-picker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin: 16px 0 4px;
    }
    .skin-preview {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #1b6b3a;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-sizing: border-box;
    }
    .skin-preview.solid::after {
      content: '';
      position: absolute;
      top: 14%;
      left: 20%;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
    }
    .skin-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    .skin-arrow:hover { background: var(--purple); border-color: var(--purple); }
    .skin-arrow:active { transform: scale(0.92); }
    .skin-name { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
    @media (max-height: 640px) {
      .skin-picker { margin: 10px 0 2px; }
      .skin-preview { width: 52px; height: 52px; }
    }

    /* ---------- Pause / game over / pause button ---------- */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 5, 22, 0.72);
      font-family: 'Fredoka', system-ui, sans-serif;
      color: var(--text);
      padding: 20px;
    }
    .overlay .box { width: 100%; max-width: 340px; text-align: center; }
    .overlay h2 {
      font-family: 'Titan One', 'Fredoka', sans-serif;
      font-weight: 400;
      font-size: 34px;
      color: #9b6bff;
      -webkit-text-stroke: 5px #12062b;
      paint-order: stroke fill;
      margin-bottom: 12px;
    }
    .over-label { font-size: 12px; letter-spacing: 1px; color: var(--muted); }
    .over-size {
      font-family: 'Titan One', 'Fredoka', sans-serif;
      font-size: 64px;
      line-height: 1.1;
      color: var(--green);
    }
    .over-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .overlay .play-btn { margin-top: 18px; }
    .ghost-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }
    .ghost-btn:hover { background: #2a1a4a; border-color: var(--purple); }
    .opt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
      text-align: left;
    }
    .tog {
      min-width: 64px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .tog.on { background: var(--purple); border-color: var(--purple); color: #fff; }
    .pause-hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
    #pause-btn {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(20, 11, 36, 0.8);
      cursor: pointer;
    }
    #pause-btn i { display: block; width: 5px; height: 16px; border-radius: 2px; background: var(--text); }
    #pause-btn:hover { background: var(--purple-dark); }

    @media (max-height: 640px) {
      .logo { font-size: 3.4rem; margin-bottom: 12px; -webkit-text-stroke-width: 7px; }
      .box { padding: 14px; }
      .settings { margin-top: 12px; padding-top: 10px; }
      .form-group { margin-bottom: 6px; }
      .controls-hint { margin-top: 10px; }
    }
    @media (max-height: 520px) {
      .menu-panel { transform: scale(0.8); transform-origin: center; }
    }
    @media (max-width: 700px) {
      .bg-blob.b1, .bg-blob.b5 { opacity: 0.5; }
      .fullscreen-menu { padding: 14px; }
    }
    .mode-picker { margin: 12px 0 2px; gap: 14px; }
    .mode-name { min-width: 150px; text-align: center; font-family: 'Titan One', 'Fredoka', system-ui, sans-serif; font-size: 19px; color: var(--text); }
    .mode-name.teams { background: linear-gradient(90deg, #ef4444, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #spec-ui { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: none; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; max-width: 94vw; padding: 10px 14px; border-radius: 14px; background: rgba(20,11,36,.9); border: 1.5px solid var(--line); font-family: 'Fredoka', system-ui, sans-serif; color: var(--text); z-index: 30; }
    #spec-ui .sp-mid { display: flex; flex-direction: column; align-items: center; min-width: 110px; }
    #spec-ui .sp-label { font-size: 10px; letter-spacing: .1em; color: var(--muted); }
    #spec-ui .sp-name { font-weight: 600; font-size: 16px; }
    .sp-btn { font-family: inherit; font-weight: 600; font-size: 14px; color: var(--text); background: #2a1a4a; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
    .sp-btn:hover { background: var(--purple); border-color: var(--purple); }
    .sp-btn.wide { padding: 8px 16px; }
    .sp-btn.ghost { background: transparent; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas"></canvas>
    
    <!-- Menu -->
    <div id="menu-ui" class="fullscreen-menu">
      <div class="bg-blob g b1"></div>
      <div class="bg-blob p b2"></div>
      <div class="bg-blob g b3"></div>
      <div class="bg-blob p b4"></div>
      <div class="bg-blob g b5"></div>
      <div class="bg-blob p b6"></div>
      <div class="bg-blob g b7"></div>

      <div class="menu-panel">
        <h1 class="logo">Blobby<span>.io</span></h1>

        <div class="box">
          <div id="tab-play" class="tab-content active">
            <input type="text" id="player-name-input" class="name-input" placeholder="Nickname" maxlength="15">
            <div class="skin-picker">
              <button class="skin-arrow" onclick="cycleSkin(-1)" aria-label="Previous skin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
              <div class="skin-preview solid" id="skin-preview"></div>
              <button class="skin-arrow" onclick="cycleSkin(1)" aria-label="Next skin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
            </div>
            <div class="skin-name" id="skin-name">Solid colour</div>
            <div class="skin-picker mode-picker">
              <button class="skin-arrow" onclick="cycleMode(-1)" aria-label="Previous mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
              <div class="mode-name" id="mode-name">Free for all</div>
              <button class="skin-arrow" onclick="cycleMode(1)" aria-label="Next mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
            </div>
            <div class="skin-name" id="mode-desc">Everyone for themselves</div>
            <button class="play-btn" onclick="startGame()">Play</button>

            <div class="settings">
              <div class="form-group" id="colour-group">
                <span class="form-label">Colour</span>
                <div class="color-picker-wrapper">
                  <span class="color-label" id="color-hex-text">#3b82f6</span>
                  <input type="color" id="player-color-picker" class="color-picker" value="#3b82f6">
                </div>
              </div>
              <div class="form-group">
                <span class="form-label">Map</span>
                <div class="grid-selector" id="theme-selector">
                  <button class="theme-btn active" onclick="setTheme('Light')">Light</button>
                  <button class="theme-btn" onclick="setTheme('Dark')">Dark</button>
                  <button class="theme-btn" onclick="setTheme('Slime')">Slime</button>
                  <button class="theme-btn" onclick="setTheme('Retro')">Retro</button>
                </div>
              </div>
              <div class="form-group">
                <span class="form-label">Bots</span>
                <div class="grid-selector">
                  <button class="diff-btn" onclick="setDiff('Easy')">Easy</button>
                  <button class="diff-btn active" id="btn-Normal" onclick="setDiff('Normal')">Normal</button>
                  <button class="diff-btn" onclick="setDiff('Hard')">Hard</button>
                </div>
              </div>
            </div>

            <div class="menu-foot">
              <span id="best-score-text">Best size 0</span>
              <button class="link-btn" onclick="switchTab('credits')">Credits</button>
            </div>
          </div>

          <div id="tab-credits" class="tab-content">
            <div class="credits-box">
              <p>Made by Hazza</p>
              <div class="orig">an <img src="https://i.ibb.co/krpP9zq/algebralogo.png" alt="algebra practise" class="algebra-logo"> original</div>
              <button class="link-btn" onclick="switchTab('play')">Back</button>
            </div>
          </div>
        </div>

        <p class="controls-hint">Move with mouse &middot; <b>Space</b> split &middot; <b>W</b> feed &middot; hide behind green viruses</p>
        <span id="status-text" style="display:none"></span>
      </div>
    </div>

    <div id="spec-ui">
      <button class="sp-btn" onclick="specStep(-1)" aria-label="Previous teammate">&#9664;</button>
      <div class="sp-mid"><span class="sp-label">SPECTATING</span><span class="sp-name" id="spec-name">-</span></div>
      <button class="sp-btn" onclick="specStep(1)" aria-label="Next teammate">&#9654;</button>
      <button class="sp-btn wide" onclick="retryGame()">Play again</button>
      <button class="sp-btn wide ghost" onclick="leaveGame()">Leave</button>
    </div>
    <button id="pause-btn" title="Pause (Esc)" onclick="pauseGame()"><i></i><i></i></button>

    <div id="pause-ui" class="overlay">
      <div class="box">
        <h2>Paused</h2>
        <div class="opt-row"><span>Minimap</span><button class="tog on" id="tog-minimap" onclick="toggleOpt('minimap')">On</button></div>
        <div class="opt-row"><span>Music</span><button class="tog on" id="tog-music" onclick="toggleOpt('music')">On</button></div>
        <div class="opt-row"><span>Sound effects</span><button class="tog on" id="tog-sfx" onclick="toggleOpt('sfx')">On</button></div>
        <div class="opt-row"><span>Kill feed</span><button class="tog on" id="tog-killfeed" onclick="toggleOpt('killfeed')">On</button></div>
        <button class="play-btn" onclick="resumeGame()">Resume</button>
        <button class="ghost-btn" onclick="leaveGame()">Leave game</button>
        <p class="pause-hint">Esc to resume</p>
      </div>
    </div>

    <div id="over-ui" class="overlay">
      <div class="box">
        <h2 id="over-title">You were eaten</h2>
        <div class="over-label">BIGGEST SIZE</div>
        <div class="over-size" id="over-size">0</div>
        <div class="over-sub" id="over-best"></div>
        <div class="over-sub" id="over-stats"></div>
        <button class="play-btn" onclick="retryGame()">Try again</button>
        <button class="ghost-btn" onclick="toMenu()">Back to menu</button>
      </div>
    </div>
  </div>

<script>
    let W = window.innerWidth;
    let H = window.innerHeight;

    const THEMES = {
      Light: { bg: '#f4f6fb', grid: '#d9dfec', border: '#8791b4', void: '#c7cde0', text: '#fff' },
      Dark:  { bg: '#0b0f19', grid: '#1e293b', border: '#334155', void: '#020617', text: '#fff' },
      Slime: { bg: '#25114a', grid: '#2f5c45', border: '#3ddc6e', void: '#120726', text: '#fff' },
      Retro: { bg: '#2b1d0c', grid: '#443019', border: '#855b28', void: '#170f05', text: '#fff' }
    };

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase() === tabName);
      });
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.toggle('active', content.id === 'tab-' + tabName);
      });
    }

    function hd(el, w, h, dpr) {
      const c = document.getElementById('canvas');
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      const ctx = c.getContext('2d');
      return [c, ctx];
    }
    function on(el, ev, fn) { el.addEventListener(ev, fn); }
    function st(txt) { 
      const s = document.getElementById('status-text');
      if (s) s.innerText = txt;

          if (scr == 'play' && !paused && me.cells.length) {
            const bt = getBtnPos(), hit = b => Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r + 8;
            if (hit(bt.split)) { split(me); return } if (hit(bt.feed)) { feed(me); return }
            const jb = joyBase(); if (joy.id === null && Math.hypot(e.clientX - jb.x, e.clientY - jb.y) < jb.r * 1.8) { joy.id = e.pointerId; try { c.setPointerCapture(e.pointerId) } catch (err) {} joyMove(e) }
          }
          return;
        }
        ptr.x = e.clientX; ptr.y = e.clientY; keyMode = false; touch = false;
      });
      window.addEventListener('pointerup', joyEnd); window.addEventListener('pointercancel', joyEnd);
      window.addEventListener('keyup', e => { const a = AK[e.key.toLowerCase()]; if (a) keys[a] = false });
      window.addEventListener('blur', () => { for (const k in keys) keys[k] = false });
      window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if (k == 'escape') { if (scr == 'play' && me && me.cells.length) paused ? resumeGame() : pauseGame(); return }
        if (scr == 'play' && curMode == 'teams' && me && !me.cells.length) { if (k == 'arrowleft') specStep(-1); else if (k == 'arrowright') specStep(1); return }
        if (scr == 'play' && !paused && me && me.cells.length && AK[k]) { e.preventDefault(); keys[AK[k]] = true; keyMode = true; return }
        if (scr != 'play' || paused || e.repeat || !me.cells.length) return;
        if (k == ' ') { e.preventDefault(); split(me) } else if (k == 'w') feed(me);
      });

      window.setDiff = function(d) {
        diff = d;
        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        try { localStorage.setItem('blobs-diff', diff) } catch(_) {}
      };

      window.startGame = function() {
        begin();
      };

      const unfocus = () => { if (document.activeElement && document.activeElement.blur) document.activeElement.blur() };
      const refreshOptUI = () => {
        ['minimap', 'music', 'sfx', 'killfeed'].forEach(n => {
          const b = byId('tog-' + n);
          b.classList.toggle('on', !!OPT[n]);
          b.innerText = OPT[n] ? 'On' : 'Off';
        });
      };
      window.toggleOpt = function(n) {
        OPT[n] = !OPT[n]; saveOpt(); refreshOptUI(); unfocus();
        if (n == 'music') AudioFX.sync(scr == 'play');
        if (n == 'sfx' && OPT.sfx) fxs('ui');
      };
      window.pauseGame = function() {
        if (scr != 'play' || !me || !me.cells.length) return;
        paused = true; refreshOptUI(); unfocus(); syncMenu();
      };
      window.resumeGame = function() { paused = false; unfocus(); syncMenu() };
      window.retryGame = function() { unfocus(); begin(); syncMenu() };
      window.toMenu = function() {
        scr = 'menu'; paused = false; unfocus();
        AudioFX.sync(false);
        byId('best-score-text').innerText = 'Best size ' + bestNow();
        st('Pick your setup and press Play.');
        syncMenu();
      };
      window.leaveGame = function() {
        try { best('blobs', peak) } catch (e) {}
        window.toMenu();
      };
      const refreshSkinUI = () => {
        const pv = byId('skin-preview'), tm_ = gameMode == 'teams', emo = EMOJI[selectedSkin], img = selectedSkin && !emo, url = img ? `url(${SKIN_URL(selectedSkin)})` : '';
        pv.style.backgroundColor = tm_ ? '#8b5cf6' : colorPicker.value;
        pv.style.borderColor = tm_ ? '#3a2a61' : shade(colorPicker.value, -.2);
        pv.style.backgroundImage = tm_ ? (img ? `linear-gradient(135deg, rgba(239,68,68,.5) 50%, rgba(59,130,246,.5) 50%), ${url}` : 'linear-gradient(135deg, #ef4444 50%, #3b82f6 50%)') : (img ? url : 'none');
        pv.classList.toggle('solid', !selectedSkin);
        pv.textContent = emo || ''; pv.style.display = emo ? 'flex' : ''; pv.style.alignItems = 'center'; pv.style.justifyContent = 'center'; pv.style.fontSize = emo ? '36px' : '';
        byId('skin-name').innerText = skinLabel(selectedSkin);
      };
      window.cycleSkin = function(d) {
        const opts = [''].concat(SKINS), i = opts.indexOf(selectedSkin);
        selectedSkin = opts[(i + d + opts.length) % opts.length];
        try { localStorage.setItem('blobs-skin', selectedSkin) } catch(e) {}
        refreshSkinUI(); unfocus(); fxs('click');
      };
      const MODES = ['ffa', 'teams'], MODE_LABEL = { ffa: 'Free for all', teams: 'Red v Blue' }, MODE_DESC = { ffa: 'Everyone for themselves', teams: 'Two teams. Last team standing wins.' };
      const refreshModeUI = () => {
        const t = gameMode == 'teams', cg = byId('colour-group');
        byId('mode-name').innerText = MODE_LABEL[gameMode]; byId('mode-name').classList.toggle('teams', t); byId('mode-desc').innerText = MODE_DESC[gameMode];
        colorPicker.disabled = t; cg.style.opacity = t ? .4 : 1; cg.style.pointerEvents = t ? 'none' : 'auto';
        refreshSkinUI();
      };
      window.cycleMode = function(d) {
        gameMode = MODES[(MODES.indexOf(gameMode) + d + MODES.length) % MODES.length];
        try { localStorage.setItem('blobs-mode', gameMode) } catch(e) {}
        refreshModeUI(); unfocus(); fxs('click');
      };
      refreshOptUI();
      refreshModeUI();

      document.getElementById('best-score-text').innerText = 'Best size ' + bestNow();
      syncMenu();
      st('Pick your setup and press Play.');
      return gloop(upd, draw);
    }

    window.onload = () => blobs(document.getElementById('game-container'));
  </script>
</body>
</html>
